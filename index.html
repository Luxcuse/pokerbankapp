  /**

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

/* ── styles ─────────────────────────────────────────────────── */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap');

.pb-root{
  --ink:#141922; --raised:#1D242F; --edge:#2C3644;
  --bone:#E9E4D8; --dim:#7E8A9C;
  --amber:#E8A33D; --clay:#C0503F; --jade:#3E8E6E;
  --azure:#4C9BE8; --violet:#A576E0;
  font-family:Archivo,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--ink); color:var(--bone);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.pb-root *{box-sizing:border-box; margin:0; padding:0;}
.pb-root button{font:inherit; color:inherit; cursor:pointer; border:none; background:none;}
.pb-root button:disabled{cursor:default;}
.pb-root input{font:inherit; color:inherit;}
.pb-root .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
.pb-root ul{list-style:none;}

.wrap{max-width:520px; margin:0 auto; padding:20px 18px 32px; display:flex; flex-direction:column; gap:18px;}
.table-wrap{padding-bottom:180px;}

.setup-head{padding:28px 0 4px;}
.mark{font-size:34px; font-weight:700; font-stretch:75%; letter-spacing:-.02em; line-height:1;}
.mark span{color:var(--amber);}
.lede{margin-top:8px; color:var(--dim); font-size:15px;}

.panel{background:var(--raised); border-radius:14px; padding:16px;}
.panel.full{width:100%;}
.panel-title{font-size:13px; font-weight:600; color:var(--dim); margin-bottom:12px;}

.field{display:flex; align-items:center; gap:10px; flex:1;}
.field span{font-size:14px; color:var(--dim); width:32px;}
.blind-row{display:flex; gap:14px;}
.pb-root input[type=number],.pb-root input[type=text],.pb-root input:not([type]){
  width:100%; background:#121720; border:1px solid var(--edge); border-radius:9px;
  padding:11px 12px; font-variant-numeric:tabular-nums;
}
.pb-root input:focus-visible,.pb-root button:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

.plist li{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--edge);}
.plist li:last-child{border-bottom:none;}
.plist .empty{color:var(--dim); font-size:14px; justify-content:center; padding:14px 0;}
.seat{width:20px; color:var(--dim); font-size:13px;}
.pname{flex:1; font-weight:600;}
.plist .num{color:var(--dim);}
.movers{display:flex; gap:2px;}
.movers button{width:28px; height:28px; border-radius:7px; background:#232B36; color:var(--dim); font-size:13px;}
.movers button:disabled{opacity:.25;}
.x{color:var(--dim); font-size:20px; line-height:1; padding:0 2px;}
.add-row{display:flex; gap:8px; margin-top:14px; align-items:center;}
.grow{flex:1;}
/* An input carries an intrinsic width of about 20 characters; without
   min-width:0 that floor is what squeezes the name field in a flex row. */
.add-row .grow{flex:1 1 auto; min-width:0;}
/* Exactly seven tabular digits — 1000000 — plus padding and borders. */
.stack-in{flex:0 0 calc(7ch + 26px); width:auto; text-align:right;}
/* desktop spinner arrows would eat into the seventh digit */
.stack-in::-webkit-outer-spin-button,
.stack-in::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.stack-in{-moz-appearance:textfield; appearance:textfield;}
.add-row .stack-in.grow{flex:1 1 auto; text-align:left;}
.add-row .btn{flex:none; padding:11px 14px;}

.roles{display:flex; flex-direction:column; gap:11px;}
.role-row{display:flex; align-items:flex-start; gap:12px;}
.role-name{font-size:14px; color:var(--dim); width:38px; padding-top:11px; flex:none;}
.role-picks{display:flex; flex-wrap:wrap; gap:7px; flex:1;}
.role-line{font-size:17px; text-align:center; color:var(--dim); line-height:1.6;}
.role-line b{color:var(--bone); font-weight:600;}
.ask{font-size:14px; color:var(--dim);}
.two-up{display:flex; gap:8px; margin-top:14px;}
.wide-row{width:100%; margin-top:4px;}

.btn{border-radius:10px; padding:13px 16px; font-weight:600; transition:transform .06s;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.35;}
.btn.primary{background:var(--amber); color:#20160A;}
.btn.ghost{background:transparent; border:1px solid var(--edge); color:var(--bone);}
.btn.wide{width:100%; padding:16px;}
.btn.fold{background:#232B36; color:var(--dim);}
.btn.call{background:#2E3947;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.topbar-acts{display:flex; gap:16px;}
.meta{font-size:13px; color:var(--dim);}
.meta em{font-style:normal; margin-left:10px; color:var(--bone);}
.link{font-size:14px; color:var(--dim); text-decoration:underline; text-underline-offset:3px;}
.link:disabled{opacity:.3; text-decoration:none;}

/* split stage: felt above, action below */
.stage{height:100vh; height:100dvh; max-width:520px; margin:0 auto;
  padding:14px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:6px;}
.stage-top{flex:1 1 50%; min-height:0; display:grid; place-items:center;}
.stage-bottom{flex:1 1 50%; min-height:0; display:flex; flex-direction:column;
  justify-content:flex-end; overflow-y:auto;}

.ring{position:relative; aspect-ratio:1; width:min(100%,42vh); flex:none;}
.ring-lines{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
.ring-lines polygon{fill:none; stroke:var(--edge); stroke-width:.4; stroke-linejoin:round;}

.pot-center{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  text-align:center; pointer-events:none;}
.pot-num{font-size:min(11vw,44px); font-weight:700; font-stretch:70%; line-height:1;
  color:var(--amber); letter-spacing:-.01em; animation:pop .32s ease-out;}
.pot-label{font-size:11px; color:var(--dim); margin-top:4px;}
@keyframes pop{from{transform:scale(1.14);}to{transform:scale(1);}}

.node{position:absolute; transform:translate(-50%,-50%); width:88px; text-align:center;
  background:var(--raised); border:1px solid transparent; border-radius:11px;
  padding:7px 4px 8px; transition:border-color .15s, background .15s;}
/* amber = whoever is to act · blue = you · violet = your turn */
.node.is-actor{border-color:var(--amber); background:#262A20;}
.node.is-mine{border-color:var(--azure); background:#1A2431;}
.node.is-mine-actor{border-color:var(--violet); background:#251F33;
  box-shadow:0 0 0 3px rgba(165,118,224,.24);}
.node.is-folded{opacity:.35;}
.node-top{display:flex; align-items:center; justify-content:center; gap:4px;}
.nname{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nstack{font-size:17px; font-weight:600; font-stretch:80%; margin-top:1px;
  font-variant-numeric:tabular-nums;}
.nstate{display:block; font-size:11px; color:var(--dim); margin-top:2px;}
.nstate.allin{color:var(--clay); font-weight:600;}

.betmark.mine{background:#24405C; color:#CFE4F7;}
.betmark{position:absolute; transform:translate(-50%,-50%);
  background:#2E3947; color:var(--bone); font-size:12px; font-weight:600;
  padding:3px 9px; border-radius:20px; white-space:nowrap;
  font-variant-numeric:tabular-nums;}

.fly{position:absolute; transform:translate(-50%,-50%);
  background:var(--amber); color:#20160A; font-size:12px; font-weight:700;
  padding:3px 9px; border-radius:20px; white-space:nowrap; pointer-events:none;
  font-variant-numeric:tabular-nums;
  transition:left .5s cubic-bezier(.32,0,.5,1), top .5s cubic-bezier(.32,0,.5,1),
             opacity .2s ease-in .34s, scale .5s ease-in;}
.fly.landed{opacity:0; scale:.55;}

.panel-act{display:flex; flex-direction:column; gap:10px; padding-top:6px;}
.log{text-align:center; font-size:13px; color:var(--dim); min-height:18px;}
.turn{text-align:center; font-size:15px; color:var(--dim);}
.turn b{color:var(--bone);}
.turn.mine b{color:var(--violet);}
.acts{display:flex; gap:8px;}
.acts .btn{flex:1; padding:19px 8px; font-size:16px;}
.acts .btn.primary{flex:1.15;}

.flash{text-align:center; color:var(--amber); font-size:17px; font-weight:600;}

.seat-top .pname{font-size:15px;}
.dealer{height:18px; padding:0 6px; min-width:18px; border-radius:10px;
  background:var(--bone); color:var(--ink); font-size:10px; font-weight:700;
  display:grid; place-items:center; flex:none;}
.dealer.sm{height:16px; font-size:9px; display:inline-grid; margin-left:6px; vertical-align:middle;}

.between{padding:20px 0; display:flex; flex-direction:column; gap:14px; align-items:center;}
.between-note{color:var(--dim); font-size:14px;}
.strip li{display:flex; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--edge);}
.strip .num{color:var(--dim);}

.sheet-back{position:fixed; inset:0; background:#0009; display:flex; align-items:flex-end; z-index:20;}
.sheet{width:100%; max-width:520px; margin:0 auto; background:var(--raised);
  border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:14px;}
.sheet-title{font-size:14px; color:var(--dim);}
.sheet-num{font-size:44px; font-weight:700; font-stretch:70%; text-align:center; color:var(--amber);}
.sheet input[type=range]{width:100%; accent-color:var(--amber);}
.chips{display:flex; gap:8px;}
.chip{padding:11px 13px; border-radius:9px; background:#232B36; font-size:14px; color:var(--dim);}
.chips .chip{flex:1; padding:11px 4px;}
.chip.on{background:var(--amber); color:#20160A; font-weight:600;}
.chip:disabled{opacity:.3;}
.sheet-acts{display:flex; gap:8px;}

.showdown{background:var(--raised); border-radius:14px; padding:14px;
  display:flex; flex-direction:column; gap:10px;}
.sd-title{font-size:14px; color:var(--dim); text-align:center;}
.sd-pot{border-top:1px solid var(--edge); padding-top:11px;}
.sd-head{display:flex; justify-content:space-between; font-size:14px; margin-bottom:9px;}
.sd-head .num{color:var(--amber); font-weight:600;}
.sd-picks{display:flex; flex-wrap:wrap; gap:8px;}
.pick{padding:10px 15px; border-radius:9px; background:#232B36; font-size:15px;}
.pick.on{background:var(--jade); color:#fff; font-weight:600;}

.settle-list li{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:13px 0; border-bottom:1px solid var(--edge);}
.s-name{display:flex; flex-direction:column; gap:3px;}
.s-sub{font-size:12px; color:var(--dim);}
.s-net{font-size:21px; font-weight:600; font-stretch:80%;}
.s-net.up{color:var(--jade);} .s-net.down{color:var(--clay);}
.warn{color:var(--clay); font-size:13px; margin-top:10px;}
.rebuy-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.hint{font-size:12px; color:var(--dim); margin-top:8px;}


/* online shell */
.notice{min-height:70vh; justify-content:center; align-items:center; text-align:center;}
.notice-title{font-size:22px; font-weight:600; font-stretch:85%;}
.center{text-align:center;}
.landing-acts{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.code-in{text-align:center; font-size:30px; font-weight:700; font-stretch:80%;
  letter-spacing:.22em; text-indent:.22em;}
.btn.sm{padding:8px 13px; font-size:14px;}

.qr-box{display:flex; flex-direction:column; align-items:center; gap:10px;
  background:var(--raised); border-radius:14px; padding:18px;}
.qr{border-radius:8px; display:block;}

.joindot{width:9px; height:9px; border-radius:50%; background:var(--edge); flex:none;}
.joindot.on{background:var(--jade);}

.meta .code{font-style:normal; font-weight:700; letter-spacing:.12em; color:var(--bone);
  margin-right:12px;}
.dealer.mine{background:var(--azure); color:#08131F;}
.node.is-mine-actor .dealer.mine{background:var(--violet); color:#150C21;}
.waiting{text-align:center; font-size:15px; color:var(--dim); padding:16px 0;}
.waiting b{color:var(--bone);}
.proxy{display:inline-block; margin-left:8px; font-size:11px; font-weight:600;
  background:var(--clay); color:#fff; padding:2px 7px; border-radius:20px;
  vertical-align:middle;}


/* first-run settings */
.paste{width:100%; background:#121720; border:1px solid var(--edge); border-radius:9px;
  padding:11px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px; line-height:1.5; resize:vertical; color:var(--bone);}
.stack-field{display:flex; flex-direction:column; gap:5px; margin-bottom:11px;}
.stack-field span{font-size:12px; color:var(--dim);}
.stack-field input{font-size:14px;}


.diag{display:flex; flex-direction:column; gap:9px; background:var(--raised);
  border-radius:12px; padding:14px;}
.diag li{display:flex; gap:10px; font-size:14px; align-items:flex-start;}
.diag li.ok{color:var(--bone);}
.diag li.bad{color:var(--clay);}
.diag-mark{font-weight:700; flex:none; width:14px;}
.diag em{display:block; font-style:normal; font-size:12px; color:var(--dim);
  margin-top:3px; line-height:1.5;}


.offline{position:sticky; top:0; z-index:30; background:var(--clay); color:#fff;
  font-size:13px; font-weight:600; text-align:center; padding:7px 12px;}


.link-out{font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  text-align:center; width:100%;}

@media (prefers-reduced-motion:reduce){ .pb-root *{transition:none !important;} }
